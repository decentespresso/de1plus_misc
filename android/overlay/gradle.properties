# Required for the androidx.* dependencies used after the support-library
# migration (mods/05-androidx-migration.patch + build.gradle's androidx.core dep).
# Without android.useAndroidX=true the :mergeReleaseNativeLibs task fails.
android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
